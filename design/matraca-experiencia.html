<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Matraca · Sua voz, por escrito</title>
<style>
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-control:10px; --radius-card:14px; --control-height:46px;
  --focus-width:3px; --focus-offset:4px;
  --motion-fast:120ms; --motion-enter:180ms; --motion-state:160ms; --motion-exit:140ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --bg:      oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(18% 0.012 250);
  --muted:   oklch(54% 0.012 250);
  --border:  oklch(92% 0.005 250);
  --accent:  oklch(58% 0.18 255);
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --soft: oklch(96.5% 0.004 250);
  --subtle: oklch(43% 0.012 250);
  --accent-strong: oklch(48% 0.18 255);
  --action-bg: oklch(56% 0.18 255);
  --brand-wash: oklch(95% 0.026 255);
  --brand-soft: oklch(97% 0.014 255);
  --brand-line: oklch(84% 0.065 255);
  --brand-ink: oklch(42% 0.12 255);
  --voice-color: oklch(54% 0.16 255);
  --voice-on-dark: oklch(80% 0.10 255);
  --on-accent: oklch(100% 0 0);
  --success: oklch(40% 0.105 155);
  --success-bg: oklch(96% 0.02 155);
  --danger: oklch(46% 0.17 25);
  --danger-bg: oklch(97% 0.015 25);
  --control-border: oklch(66% 0.012 250);
  --hud-bg: oklch(21% 0.013 250 / .96);
  --hud-fg: oklch(98% 0.002 250);
  --hud-muted: oklch(79% 0.008 250);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: oklch(19% 0.008 250); --surface: oklch(22% 0.008 250);
  --fg: oklch(95% 0.003 250); --muted: oklch(73% 0.01 250);
  --border: oklch(32% 0.012 250); --soft: oklch(25% 0.01 250);
  --subtle: oklch(79% 0.008 250); --control-border: oklch(57% 0.01 250);
  --success: oklch(80% 0.10 155); --success-bg: oklch(26% 0.025 155);
  --danger: oklch(80% 0.105 25); --danger-bg: oklch(26% 0.025 25);
  --brand-wash: oklch(26% 0.045 255);
  --brand-soft: oklch(24% 0.025 255);
  --brand-line: oklch(43% 0.07 255);
  --brand-ink: oklch(83% 0.08 255);
  --voice-color: oklch(75% 0.13 255);
}
/* Palette accents share neutral foundations; only highlights change hue. */
:root[data-palette="olive"] { --palette-hue: 125; }
:root[data-palette="ochre"] { --palette-hue: 85; }
:root[data-palette="terracotta"] { --palette-hue: 35; }
:root[data-palette="plum"] { --palette-hue: 325; }
:root[data-palette="teal"] { --palette-hue: 175; }
:root[data-palette] {
  --accent: oklch(48% 0.13 var(--palette-hue));
  --action-bg: oklch(48% 0.13 var(--palette-hue));
  --accent-strong: oklch(40% 0.11 var(--palette-hue));
  --on-accent: oklch(100% 0 0);
  --brand-wash: oklch(97% 0.012 var(--palette-hue));
  --brand-soft: oklch(98% 0.006 var(--palette-hue));
  --brand-line: oklch(83% 0.035 var(--palette-hue));
  --brand-ink: oklch(40% 0.10 var(--palette-hue));
  --voice-color: oklch(48% 0.13 var(--palette-hue));
  --voice-on-dark: oklch(82% 0.16 var(--palette-hue));
}
:root[data-palette][data-theme="dark"] {
  --accent: oklch(82% 0.16 var(--palette-hue));
  --action-bg: oklch(82% 0.16 var(--palette-hue));
  --accent-strong: oklch(90% 0.12 var(--palette-hue));
  --on-accent: oklch(18% 0.012 250);
  --brand-wash: var(--soft);
  --brand-soft: var(--surface);
  --brand-line: var(--border);
  --brand-ink: oklch(82% 0.16 var(--palette-hue));
  --voice-color: oklch(82% 0.16 var(--palette-hue));
}
.palette-picker { display:flex; align-items:center; gap:9px; font-size:12px; color:var(--subtle); }
.palette-swatch { width:10px; height:10px; border-radius:50%; background:var(--accent); flex-shrink:0; }
.palette-picker select { min-width:190px; color:var(--fg); background:var(--surface); }
.appearance-menu { position:relative; border:0; padding:0; }
.appearance-menu > summary { border:1px solid var(--control-border); border-radius:10px; padding:9px 14px; gap:9px; font-size:12px; list-style:none; color:var(--fg); background:var(--surface); }
.appearance-menu > summary::-webkit-details-marker { display:none; }
.appearance-menu > summary::after { content:none; }
.appearance-menu > summary:hover { background:var(--soft); }
.appearance-panel { position:absolute; z-index:30; right:0; top:52px; width:min(340px,calc(100vw - 40px)); padding:22px; background:var(--surface); border:1px solid var(--control-border); border-radius:14px; box-shadow:0 12px 35px oklch(0% 0 0 / .18); }
.appearance-controls { display:grid; gap:16px; }
.appearance-controls label { display:grid; gap:7px; font-size:12px; font-weight:600; }
.appearance-controls select { width:100%; }
.appearance-colors { margin:0; padding:0; border:0; min-width:0; }
.appearance-colors legend { font-size:12px; font-weight:600; margin-bottom:8px; }
.color-choice { display:flex; align-items:center; gap:12px; width:100%; min-height:52px; border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:9px; padding:10px 12px; margin:5px 0; text-align:left; font-size:12px; }
.color-choice[aria-pressed="true"] { border-color:var(--brand-ink); background:var(--brand-soft); }
.color-choice:hover { border-color:var(--brand-ink); background:var(--surface); }
.color-choice .color-samples { width:32px; height:24px; display:flex; flex-shrink:0; }
.color-samples i { width:16px; height:24px; background:oklch(48% .13 var(--sample-hue)); border-radius:12px 0 0 12px; }
.color-samples i + i { background:oklch(82% .16 var(--sample-hue)); border-radius:0 12px 12px 0; }
.color-choice > span:nth-child(2) { flex:1; }
.color-choice svg { width:16px; height:16px; }
.appearance-help { font-size:12px; color:var(--subtle); margin:0!important; }
.settings-appearance { max-width:530px; padding:20px 0 28px; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 var(--font-body); -webkit-font-smoothing:antialiased; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button,a,input,select,textarea,summary { -webkit-tap-highlight-color:transparent; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:var(--focus-width) solid var(--accent); outline-offset:var(--focus-offset); }
button:disabled { cursor:not-allowed; opacity:.5; }
button { letter-spacing:.02em; }
svg { display:block; width:20px; height:20px; flex-shrink:0; }
svg.definitions { position:absolute; width:0; height:0; }
h1,h2,h3 { font-family:var(--font-display); font-weight:600; text-wrap:balance; }
h1 { font-size:38px; letter-spacing:-.02em; line-height:1.16; margin:0 0 14px; }
h2 { font-size:23px; letter-spacing:-.015em; line-height:1.3; margin:0 0 10px; }
h3 { font-size:18px; line-height:1.4; margin:0 0 5px; }
p { margin:0; text-wrap:pretty; max-width:65ch; }
strong,b { font-weight:600; }
.muted { color:var(--subtle); }
.small { font-size:12px; line-height:1.5; letter-spacing:.015em; }
.eyebrow { font-size:12px; font-weight:600; line-height:1.5; letter-spacing:.09em; text-transform:uppercase; color:var(--subtle); }
.topbar { min-height:80px; padding:16px 38px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:20px; background:var(--surface); }
.wordmark { display:flex; align-items:center; gap:11px; font:600 23px/1 var(--font-display); letter-spacing:-.025em; }
.app-icon { display:grid; place-items:center; width:35px; height:35px; border-radius:10px; background:var(--accent); color:var(--on-accent); flex-shrink:0; }
.app-icon svg { width:27px; height:27px; }
.top-right { margin-left:auto; display:flex; gap:14px; align-items:center; }
.preview-label { display:flex; align-items:center; gap:7px; color:var(--subtle); padding:8px 10px; background:transparent; border:0; font-size:12px; min-height:44px; }
.preview-label svg { width:15px; height:15px; }
.icon-button { width:44px; min-width:44px; height:44px; padding:11px; border:1px solid var(--border); border-radius:10px; background:var(--surface); display:grid; place-items:center; }
.icon-button:hover,.secondary:hover,.text-button:hover { background:var(--soft); color:var(--fg); border-color:var(--control-border); }
.btn { min-height:var(--control-height); display:inline-flex; align-items:center; justify-content:center; gap:var(--space-3); padding:11px 21px; border:1px solid transparent; border-radius:var(--radius-control); font-size:15px; font-weight:600; text-decoration:none; }
.primary { color:var(--on-accent); background:var(--action-bg); }
.primary:hover:not(:disabled) { color:var(--on-accent); background:var(--accent-strong); }
.secondary { background:var(--surface); color:var(--fg); border-color:var(--control-border); }
.text-button { min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 11px; background:transparent; color:var(--subtle); border:1px solid transparent; border-radius:8px; font-size:12px; }
.danger { color:var(--danger); }
.danger:hover { background:var(--danger-bg); color:var(--danger); }
.actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.grow { flex:1; }
.lock-note { display:flex; align-items:flex-start; gap:10px; color:var(--subtle); font-size:12px; letter-spacing:.01em; line-height:1.5; }
.lock-note svg { width:16px; height:16px; margin-top:1px; }
.welcome { max-width:1320px; margin:auto; min-height:calc(100vh - 80px); display:grid; grid-template-columns:1fr 1fr; }
.welcome-story { padding:72px 64px 36px 50px; display:flex; flex-direction:column; position:relative; border-right:1px solid var(--brand-line); background:var(--brand-wash); }
.welcome-story h1 { font-size:clamp(38px,4.4vw,60px); line-height:1.09; letter-spacing:-.03em; margin:22px 0 18px; }
.welcome-story .intro { max-width:34ch; color:var(--subtle); }
.voice-print { min-height:226px; flex:1; display:flex; align-items:center; justify-content:center; gap:7px; margin:18px 0; color:var(--voice-color); }
.voice-print i { display:block; width:6px; height:var(--h); max-height:156px; background:currentColor; border-radius:8px; opacity:var(--o,1); }
.story-bottom { display:flex; justify-content:space-between; gap:20px; align-items:flex-end; border-top:1px solid var(--brand-line); padding-top:22px; }
.story-bottom .platforms { text-align:right; color:var(--subtle); }
.welcome-content { padding:66px 54px 40px; display:flex; flex-direction:column; justify-content:center; }
.step-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:30px; }
.step-dots { display:flex; gap:6px; }
.step-dots i { display:block; height:4px; width:22px; border-radius:4px; background:var(--border); }
.step-dots i.current { background:var(--voice-color); }
.setup-intro { color:var(--subtle); margin-bottom:30px; }
.setup-list { margin:0 0 30px; padding:0; list-style:none; }
.setup-list li { display:flex; gap:16px; padding:21px 0; border-bottom:1px solid var(--border); align-items:center; }
.setup-list li:first-child { border-top:1px solid var(--border); }
.step-num { width:34px; height:34px; border:1px solid var(--brand-line); background:var(--brand-soft); color:var(--brand-ink); display:grid; place-items:center; border-radius:50%; flex-shrink:0; font-size:12px; font-variant-numeric:tabular-nums; }
.setup-list strong { display:block; margin-bottom:3px; }
.setup-list p { color:var(--subtle); font-size:12px; line-height:1.5; letter-spacing:.01em; }
.setup-footer { margin-top:26px; color:var(--subtle); }
.setup-footer .text-button { padding-inline:0; text-decoration:underline; text-underline-offset:4px; }
.preparation { background:var(--brand-soft); border:1px solid var(--brand-line); border-radius:14px; padding:22px; margin:26px 0; }
.prep-heading { display:flex; gap:12px; align-items:center; margin-bottom:20px; }
.prep-heading > svg { width:30px; height:30px; }
progress { display:block; width:100%; height:6px; border:0; border-radius:5px; accent-color:var(--fg); background:var(--border); }
progress::-webkit-progress-bar { background:var(--border); border-radius:5px; }
progress::-webkit-progress-value { background:var(--fg); border-radius:5px; }
.progress-caption { display:flex; justify-content:space-between; gap:12px; margin:12px 0 0; font-size:12px; color:var(--subtle); }
.permit-row { border:1px solid var(--border); border-radius:12px; padding:17px; display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.permit-row > div { flex:1; min-width:0; }
.permit-row p { color:var(--subtle); font-size:12px; margin-top:4px; }
.permit-row .text-button { padding:8px; }
.check-tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--success); }
.check-tag svg { width:16px; height:16px; }
.callout { border-radius:10px; padding:14px 16px; background:var(--soft); color:var(--subtle); font-size:12px; line-height:1.6; margin:18px 0; }
.select-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px; padding:20px 0; }
select,input[type="search"] { border:1px solid var(--control-border); background:var(--surface); border-radius:9px; padding:11px 12px; min-height:44px; max-width:100%; }
select { font-size:12px; }
kbd { padding:4px 7px; border:1px solid var(--control-border); border-bottom-width:2px; border-radius:5px; background:var(--surface); color:var(--fg); font:12px/1.5 var(--font-body); letter-spacing:.01em; }
.test-box { margin:20px 0; border:1px solid var(--control-border); border-radius:12px; background:var(--surface); }
.test-box header { padding:12px 16px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); font-size:12px; color:var(--subtle); }
.test-box .test-result { min-height:116px; padding:20px; font-size:18px; line-height:1.55; }
.test-result.empty { color:var(--subtle); font-size:15px; }
.app-layout { display:grid; grid-template-columns:222px 1fr; min-height:calc(100vh - 80px); }
.sidebar { display:flex; flex-direction:column; padding:27px 18px 23px; border-right:1px solid var(--border); background:var(--surface); }
.sidebar nav { display:grid; gap:5px; }
.nav-link { display:flex; align-items:center; gap:12px; width:100%; min-height:46px; padding:11px 14px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--subtle); text-align:left; font-size:15px; }
.nav-link:hover { background:var(--soft); color:var(--fg); }
.nav-link.active { background:var(--brand-wash); color:var(--fg); border-color:var(--brand-line); font-weight:600; }
.nav-link.active svg { color:var(--brand-ink); }
.nav-link.active:hover { background:var(--brand-soft); color:var(--fg); }
.sidebar-bottom { margin-top:auto; padding-top:56px; }
.sidebar .lock-note { border-top:1px solid var(--border); margin:18px 8px 0; padding-top:20px; }
.main { width:100%; max-width:1080px; margin:auto; padding:40px 52px 110px; min-width:0; align-self:start; }
.page-title { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:35px; }
.page-title h1 { margin:0; font-size:30px; }
.pill { border:1px solid var(--border); border-radius:25px; padding:6px 10px; display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--subtle); }
.pill svg { width:14px; height:14px; }
.dictation-hero { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; padding:30px 0 37px; }
.dictation-hero h2 { font-size:38px; line-height:1.16; letter-spacing:-.025em; margin:13px 0 18px; }
.dictation-hero p { max-width:42ch; color:var(--subtle); }
.dictation-hero .actions { margin-top:26px; }
.signal { width:126px; height:126px; display:flex; justify-content:center; gap:7px; align-items:center; border:1px solid var(--brand-line); border-radius:50%; background:var(--brand-soft); }
.signal i { width:7px; height:var(--h); border-radius:8px; background:var(--voice-color); }
.listening .signal i,.listening .hud-wave i { animation:listen .7s ease-in-out infinite alternate; animation-delay:var(--delay,0s); }
.info-strip { display:grid; grid-template-columns:1fr 1fr 1fr; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin:0 0 30px; }
.info-strip > div { padding:20px 18px; border-right:1px solid var(--border); }
.info-strip > div:first-child { padding-left:0; }
.info-strip > div:last-child { border-right:0; }
.info-strip dt { color:var(--subtle); font-size:12px; margin-bottom:6px; }
.info-strip dd { margin:0; font-weight:600; font-size:15px; }
.editor { border:1px solid var(--control-border); border-radius:14px; background:var(--surface); }
.editor-header { display:flex; align-items:center; gap:10px; padding:15px 20px; border-bottom:1px solid var(--border); font-size:12px; }
.editor-header .pill { margin-left:auto; }
.editor textarea { width:100%; border:0; resize:vertical; min-height:154px; padding:22px; background:transparent; display:block; line-height:1.6; border-radius:0 0 14px 14px; }
.editor textarea::placeholder { color:var(--subtle); opacity:1; }
.editor-footer { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; }
.latest { display:flex; gap:15px; align-items:flex-start; padding:24px 0; margin-top:20px; border-top:1px solid var(--border); }
.latest p { margin-top:6px; }
.empty-history { text-align:center; padding:64px 24px; border:1px dashed var(--control-border); border-radius:14px; }
.empty-history > svg { width:40px; height:40px; margin:0 auto 20px; }
.empty-history p { margin:0 auto 20px; color:var(--subtle); }
.history-list { display:grid; gap:12px; margin-top:24px; }
.history-card { padding:22px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
.history-card header { display:flex; gap:15px; justify-content:space-between; color:var(--subtle); margin-bottom:14px; font-size:12px; }
.history-card .actions { margin-top:16px; }
.full-search { width:100%; }
.settings-section { margin-bottom:35px; }
.settings-section > h2 { margin:25px 0 15px; font-size:18px; }
.setting { display:flex; gap:24px; align-items:center; justify-content:space-between; padding:21px 0; border-top:1px solid var(--border); }
.setting p { color:var(--subtle); font-size:12px; margin-top:5px; max-width:50ch; }
.switch { min-width:48px; height:44px; border:0; padding:10px 0; background:transparent; }
.switch-track { width:44px; height:24px; border-radius:20px; background:var(--control-border); display:block; padding:3px; }
.switch-track i { display:block; width:18px; height:18px; border-radius:50%; background:var(--surface); }
.switch[aria-checked="true"] .switch-track { background:var(--fg); }
.switch[aria-checked="true"] .switch-track i { transform:translateX(20px); }
details { border-top:1px solid var(--border); padding:18px 0; }
summary { cursor:pointer; min-height:44px; display:flex; align-items:center; gap:10px; font-weight:600; }
summary::after { content:'+'; margin-left:auto; }
details[open] summary::after { content:'−'; }
details p { font-size:12px; color:var(--subtle); margin:8px 0 14px; }
.about-mark { background:var(--brand-wash); border:1px solid var(--brand-line); border-radius:16px; padding:40px; display:flex; align-items:center; gap:30px; margin-bottom:28px; }
.about-mark .app-icon { width:96px; height:96px; border-radius:25px; }
.about-mark .app-icon svg { width:74px; height:74px; }
.about-mark h2 { font-size:30px; margin-bottom:8px; }
.icon-family { display:flex; gap:25px; align-items:center; padding:20px 0; }
.mono-mark { color:var(--fg); }
.mono-mark.small-mark { width:16px; height:16px; }
.mono-mark.medium-mark { width:24px; height:24px; }
.hud-wrap { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:15; width:min(480px,calc(100% - 32px)); }
.hud { display:flex; align-items:center; gap:16px; padding:15px 18px; border:1px solid var(--control-border); border-radius:16px; background:var(--hud-bg); color:var(--hud-fg); backdrop-filter:blur(18px); box-shadow:0 12px 35px oklch(0% 0 0 / .17); }
.hud-copy { flex:1; min-width:0; }
.hud-copy strong { font-size:15px; display:block; }
.hud-copy p { color:var(--hud-muted); font-size:12px; margin-top:2px; }
.hud-wave { width:26px; height:30px; display:flex; gap:3px; align-items:center; }
.hud-wave i { display:block; width:4px; background:var(--voice-on-dark); border-radius:4px; height:var(--h); }
.hud .icon-button { background:transparent; color:var(--hud-fg); border-color:var(--hud-muted); }
.hud .icon-button:hover { background:oklch(33% 0.013 250); }
.hud .text-button { color:var(--hud-fg); border-color:var(--hud-muted); }

<script>

const state = { view:'setup', step:0, preparing:false, progress:0, prepared:false, microphone:false, accessibility:false, tested:false, complete:false, status:'ready', history:[], draft:'', target:true, keepHistory:true, sound:true, hotkey:'Ctrl + Shift + Espaço', theme:'dark', palette:'olive', query:'', testText:'', pending:'', modal:null };
const consumption = {entries:[], provider:'all', selectedId:null};

const FRAME_STATES=[['ready','Pronto'],['listening','Ouvindo'],['thinking','Processando'],['writing','Inserindo'],['done','Concluído'],['error','Erro']];

 ['language','dictation','text','pt','Idioma do reconhecimento','pt, en, es ou auto. Outros códigos aceitos pelo modelo podem ser informados.'],

 ['focusBorderColor','delivery','color','#E81123','Cor da moldura: pronto','Valor existente no código; independente do tema da interface.'],
 ['focusBorderColorBusy','delivery','color','#FFB900','Cor da moldura: ocupado','Formato compartilhado entre plataformas: #RRGGBB.'],
 ['focusBorderColorPinned','delivery','color','#0078D4','Cor da moldura: fixado','Personaliza o destino fixado, não a identidade do Matraca.'],
 ['history','history','boolean',true,'Guardar meus ditados','Nesta prévia, apenas em memória durante a sessão.'],
 ['historyMaxItems','history','number',100,'Limite de ditados','Ao ultrapassar o limite, os mais antigos são descartados.',[1,5000,1,'itens']],

 ['postProcessApiKey','review','secret',null,'Credencial da Anthropic','Não insira chaves reais no protótipo.'],
 ['postProcessOpenAiApiKey','review','secret',null,'Credencial da API compatível','Não insira chaves reais no protótipo.'],
 ['postProcessDeepSeekApiKey','review','secret',null,'Credencial da DeepSeek','Não insira chaves reais no protótipo.'],

function icon(name,cls='') { return `<svg class="${cls}" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><use href="#${name}"></use></svg>`; }
function button(action,label,kind='secondary',extra='') { return `<button type="button" class="btn ${kind}" data-action="${action}" data-od-id="${action}" ${extra}>${label}</button>`; }
function textButton(action,label,extra='',scope='action') { return `<button type="button" class="text-button${action.startsWith('delete-entry-')?' danger':''}" data-action="${action}" data-od-id="${scope}-${action}" ${extra}>${label}</button>`; }

function feedback(kind,title,message,id,actions='') { return `<div class="feedback ${kind}" data-od-id="${id}">${icon(kind==='error'?'warning':kind==='success'?'check':'info')}<div><strong>${escapeHTML(title)}</strong><p>${escapeHTML(message)}</p>${actions?`<div class="actions">${actions}</div>`:''}</div></div>`; }

function hotkeySelect() { return `<select aria-label="Atalho de ditado" data-control="hotkey" data-od-id="hotkey-select">${['Ctrl + Shift + Espaço','Alt + Espaço','F8'].map(k=>`<option${state.hotkey===k?' selected':''}>${k}</option>`).join('')}</select>`; }
function appearanceControls(scope) {
 return `<div class="appearance-controls"><label>Modo de exibição<select data-control="theme" data-od-id="${scope}-theme" aria-label="Modo de exibição">${[['system','Acompanhar o sistema'],['light','Claro'],['dark','Escuro']].map(([id,name])=>`<option value="${id}"${state.theme===id?' selected':''}>${name}</option>`).join('')}</select></label><fieldset class="appearance-colors"><legend>Cor de destaque · claro / escuro</legend>${PALETTES.map(([id,light,dark,hue])=>`<button type="button" class="color-choice" aria-pressed="${state.palette===id}" data-action="color-${id}" data-od-id="${scope}-color-${id}"><span class="color-samples" aria-hidden="true" style="--sample-hue:${hue}"><i></i><i></i></span><span>${light} / ${dark}</span>${state.palette===id?icon('check'):''}</button>`).join('')}</fieldset><p class="appearance-help">${state.theme==='system'?'O modo acompanha o sistema automaticamente. A família de cor escolhida é mantida.':'A cor se adapta ao modo claro ou escuro. Você mantém a mesma família ao alternar.'}</p><p class="appearance-help">Aplicação imediata. Preferência salva neste navegador, sem alterar seus ditados.</p></div>`;
}

}
function wave(cls='signal') { return `<div class="${cls}" aria-hidden="true">${[14,28,44,28,18].map((h,i)=>`<i style="--h:${h}px;--delay:${i*.11}s"></i>`).join('')}</div>`; }
function story() { const heights=[12,20,13,27,42,26,57,81,42,101,133,92,155,106,71,121,151,108,67,86,47,29,41,22,13,21,11]; return `<aside class="welcome-story" data-od-id="welcome-story"><p class="eyebrow">Sua voz, por escrito</p><h1 data-od-id="brand-headline">Menos teclado.<br>Mais você.</h1><p class="intro">Uma ideia, uma mensagem, o que vier.<br>Fale naturalmente. O Matraca escreve.</p><div class="voice-print" aria-hidden="true">${heights.map((h,i)=>`<i style="--h:${h}px;--o:${i<5||i>21?'.25':i<9||i>18?'.5':'1'}"></i>`).join('')}</div><div class="story-bottom"><div class="lock-note">${icon('shield')}<span>Reconhecimento de voz<br><strong>no seu computador.</strong></span></div><div class="small platforms">Feito para acompanhar<br>o seu dia.</div></div></aside>`; }
function setup() {
 let content='';
 if(state.step===0) content=`<h2 data-od-id="setup-title">Seu primeiro ditado<br>começa aqui.</h2><p class="setup-intro">Vamos deixar tudo pronto para você falar<br>e ver suas palavras aparecerem.</p><ol class="setup-list"><li data-od-id="setup-recognition"><span class="step-num">1</span><div><strong>Preparar o reconhecimento</strong><p>Um modelo local para transformar voz em texto.</p></div></li><li data-od-id="setup-permissions"><span class="step-num">2</span><div><strong>Dar voz ao Matraca</strong><p>Conferir microfone, permissões e atalho.</p></div></li><li data-od-id="setup-first-phrase"><span class="step-num">3</span><div><strong>Experimentar uma frase</strong><p>Terminar com um ditado, não com dúvidas.</p></div></li></ol>${button('prepare','Preparar o Matraca '+icon('arrow'),'primary')}<p class="small setup-footer">Sem conta para começar. Você controla o que fica salvo.</p>`;
 if(state.step===1) content=`<h2 data-od-id="setup-title">O reconhecimento<br>fica por aqui.</h2><p class="setup-intro">Depois de baixar o modelo, você pode ditar sem internet. Seu áudio é processado neste computador.</p><div class="preparation" data-od-id="model-preparation"><div class="prep-heading">${icon(state.prepared?'check':'download')}<div><strong>Whisper · Small</strong><p class="small muted">Português · aproximadamente 465 MB</p></div></div><progress id="download-progress" max="100" value="${state.progress}" aria-label="Progresso simulado da preparação"></progress><div class="progress-caption"><span id="download-caption">${state.prepared?'Modelo preparado na demonstração':'Preparando o modelo · simulação'}</span><span id="download-percent">${state.progress}%</span></div></div><p class="small muted">O modelo pode ser trocado depois, nas configurações.</p><div class="actions" style="margin-top:28px">${button('permissions-step','Continuar '+icon('arrow'),'primary',state.prepared?'':'disabled')}${state.preparing?textButton('cancel-preparation','Cancelar'):textButton('setup-back','Voltar')}</div><p class="small setup-footer">Nesta prévia, nenhum arquivo será baixado.</p>`;
 if(state.step===2) content=`<h2 data-od-id="setup-title">Pode falar.<br>Vamos conferir?</h2><p class="setup-intro">O Matraca precisa ouvir você e inserir o texto no aplicativo que estiver usando.</p><div class="permit-row" data-od-id="microphone-permission">${icon('mic')}<div><strong>Microfone</strong><p>Ouvir somente durante o ditado.</p></div>${state.microphone?`<span class="check-tag">${icon('check')}Permitido</span>`:textButton('allow-microphone','Permitir')}</div><div class="permit-row" data-od-id="writing-permission">${icon('keyboard')}<div><strong>Escrever em aplicativos</strong><p>${isMac()?'Requer Acessibilidade nos Ajustes do Mac.':'Verificar a inserção de texto no Windows.'}</p></div>${state.accessibility?`<span class="check-tag">${icon('check')}Conferido</span>`:textButton('allow-writing','Conferir')}</div><div class="select-row"><div><strong>Seu atalho</strong><p class="small muted">Pressione para começar e para parar.</p></div>${hotkeySelect()}</div><div class="callout">As permissões são simuladas nesta prévia. Na aplicação, essa etapa será validada pelo sistema operacional.</div><div class="actions">${button('test-step','Experimentar uma frase '+icon('arrow'),'primary',state.microphone&&state.accessibility?'':'disabled')}${textButton('back-model','Voltar')}</div>`;
 if(state.step===3) content=`<h2 data-od-id="setup-title">${state.tested?'Pronto. É assim<br>que começa.':'Sua primeira frase.<br>Do seu jeito.'}</h2><p class="setup-intro">${state.tested?'O texto apareceu e o microfone parou. No aplicativo, o mesmo acontece onde você estiver escrevendo.':'Na aplicação, use seu atalho e fale naturalmente. Aqui, experimente o fluxo com uma frase de exemplo.'}</p><div class="test-box" data-od-id="first-dictation"><header>${icon('document')}Seu primeiro ditado <span class="grow"></span><span>Teste guiado</span></header><div class="test-result ${state.testText?'':'empty'}" id="test-result">${escapeHTML(state.testText)||'Suas palavras vão aparecer aqui.'}</div></div><div class="status-line" style="margin-bottom:22px">${icon(state.tested?'check':'keyboard')}<span>${state.tested?'Ditado de exemplo inserido com sucesso.':`Atalho escolhido: ${escapeHTML(state.hotkey)}`}</span></div><div class="actions">${state.tested?button('finish-setup','Começar a usar '+icon('arrow'),'primary'):button(state.status==='listening'?'stop':'start-test',state.status==='listening'?icon('stop')+' Encerrar teste':icon('mic')+' Iniciar teste','primary',['transcribing','writing'].includes(state.status)?'disabled':'')}${state.tested?textButton('repeat-test','Testar novamente'):textButton('back-permissions','Voltar',state.status!=='ready'?'disabled':'')}</div><p class="small setup-footer">Demonstração sem captura de áudio. A frase é ilustrativa.</p>`;

}

 const prices=model==='deepseek-v4-flash'?[.007,.22,.66]:model==='deepseek-v4-pro'?[.022,.66,1.98]:null;

function changeConfig(key,value){
 const field=CONFIG_FIELDS.find(([id])=>id===key);if(!field||field[2]==='secret')return false;
 const [,,type,,,,options]=field;let next=value,error='';
 if(type==='number'){next=Number(value);if(String(value).trim()===''||!Number.isFinite(next)||next<options[0]||next>options[1])error=`Informe um valor entre ${options[0]} e ${options[1]}.`;if(options[2]>=1&&!Number.isInteger(next))error='Informe um número inteiro.';}
 if(type==='boolean')next=!!value;
 if(type==='select'&&!options.some(([v])=>v===value))error='Selecione uma opção válida.';
 if(type==='color'&&!/^#[0-9a-f]{6}$/i.test(value))error='Use uma cor no formato #RRGGBB.';
 if(type==='list')next=[...new Map(String(value).split('\n').map(x=>x.trim()).filter(Boolean).map(x=>[x.toLocaleLowerCase(),x])).values()];
 if(type==='map'){next={};for(const line of String(value).split('\n').filter(x=>x.trim())){const match=line.match(/^(.+?)\s*=\s*([\d.]+)\s*$/);if(!match||!match[1].trim()||!Number.isFinite(Number(match[2]))||Number(match[2])<0.001||Number(match[2])>0.5){error='Use nome = valor, com limiar entre 0.001 e 0.5.';break;}const name=match[1].trim();if(['__proto__','constructor','prototype'].includes(name.toLowerCase())){error='Nome de dispositivo inválido.';break;}const prior=Object.keys(next).find(k=>k.toLowerCase()===name.toLowerCase());if(prior)delete next[prior];next[name]=Number(match[2]);}}
 if(key==='postProcessEndpoint'&&value){try{const url=new URL(value);if(url.username||url.password||!(url.protocol==='https:'||(url.protocol==='http:'&&['localhost','127.0.0.1','[::1]'].includes(url.hostname))))error='Use HTTPS remoto ou HTTP local, sem credencial na URL.';}catch(_){error='Informe uma URL completa válida.';}}
 if((key==='hotkey'||key==='pinHotkey')&&String(value).trim()&&String(value).trim().toLowerCase()===String(config[key==='hotkey'?'pinHotkey':'hotkey']).trim().toLowerCase())error='Os dois atalhos precisam ser diferentes.';
 if(key==='postProcess'&&next){if(!config.postProcessModel.trim()||(config.postProcessProvider==='deepseek'&&!config.postProcessReasoning)||!configUI.credentials[credentialKey()])error='Configure modelo, credencial de exemplo e, no DeepSeek, raciocínio antes de ativar.';if(Object.keys(configUI.errors).some(k=>k!=='postProcess'&&k.startsWith('postProcess')&&configVisible(k)))error='Corrija os campos de revisão destacados antes de ativar.';}
 if(error){configUI.errors[key]=error;if(!configUI.drafts)configUI.drafts={};if(type!=='boolean')configUI.drafts[key]=value;render();announce(error);return false;}
 delete configUI.errors[key];if(configUI.drafts)delete configUI.drafts[key];
 if(key==='postProcessProvider'&&next!==config.postProcessProvider){configUI.credentials[credentialKey()]=false;config.postProcess=false;config.postProcessModel=next==='anthropic'?'claude-opus-5':'';config.postProcessReasoning='';configUI.reviewResult=false;for(const k of CONFIG_FIELDS.filter(([,group])=>group==='review').map(([k])=>k)){delete configUI.errors[k];if(configUI.drafts)delete configUI.drafts[k];}}
 config[key]=next;
 if(['postProcessModel','postProcessReasoning','postProcessEndpoint'].includes(key)){config.postProcess=false;configUI.reviewResult=false;}
 if(key==='history')state.keepHistory=next;if(key==='beep')state.sound=next;
 if(key==='historyMaxItems')state.history=state.history.slice(0,next);
 render();announce('Configuração aplicada nesta sessão de demonstração.');return true;
}
function downloadModel(id){if(configUI.modelDownload||!MODEL_CATALOG.some(([key])=>key===id))return;configUI.modelDownload=id;configUI.modelProgress=0;render();function tick(){if(configUI.modelDownload!==id)return;configUI.modelProgress+=25;if(configUI.modelProgress>=100){config.modelPath='models/'+id;configUI.modelDownload=null;render();announce('Modelo selecionado na demonstração. Nenhum arquivo foi baixado.');}else{const p=$('config-download-progress'),l=$('config-download-label');if(p)p.value=configUI.modelProgress;if(l)l.textContent=configUI.modelProgress+'% · simulação';configTimer=setTimeout(tick,500);}}configTimer=setTimeout(tick,500);}
function about() { return `<div class="page-title"><h1 data-od-id="about-title">Sobre o Matraca</h1></div><section class="about-mark" data-od-id="brand-signature"><span class="app-icon">${icon('mark')}</span><div><h2>Matraca</h2><p class="muted">Sua voz, por escrito.</p><p class="small muted" style="margin-top:10px">Identidade proposta · Windows e macOS</p></div></section><h2 data-od-id="brand-intent">Pequeno na tela.<br>Presente quando precisa.</h2><p class="muted">Um “m” com ritmo de voz. O mesmo desenho no aplicativo, na bandeja e na barra de menus, sem depender da cor para ser reconhecido.</p><div class="icon-family" aria-label="Versões monocromáticas do símbolo em 16 e 24 pixels" data-od-id="system-icon-variants">${icon('mark','mono-mark small-mark')}${icon('mark','mono-mark medium-mark')}<span class="small muted">Símbolo para as áreas do sistema</span></div><details open data-od-id="privacy-details"><summary>O que fica no computador?</summary><p>A transcrição usa um modelo local. A revisão opcional pode enviar texto ao provedor configurado. Histórico e registros técnicos precisam de controles claros de retenção na aplicação.</p><p>Esta prévia não acessa microfone, não envia texto e não baixa modelos. Tema e atalho ficam salvos neste navegador; os ditados de exemplo não persistem ao recarregar.</p></details>${textButton('nav-home','Voltar ao ditado '+icon('arrow'))}`; }
function systemGuide() {
 const tokens=[['--bg','Fundo da aplicação'],['--surface','Painéis e campos'],['--fg','Texto principal'],['--subtle','Texto de apoio'],['--action-bg','Ação principal'],['--on-accent','Texto sobre a ação'],['--danger','Erro, não identidade']];
  return `<div class="ds-intro" data-od-id="system-intro"><span class="eyebrow">Matraca Design System · 1.0.1</span><h1>Um padrão.<br>Todas as telas.</h1><p>A especificação define as regras; os mocks demonstram a aplicação. Este catálogo reutiliza componentes do protótipo, mas ainda contém diferenças documentadas antes do refactor.</p><div class="actions" style="margin-top:20px"><a class="btn secondary" href="docs/design-system.md" target="_blank" rel="noopener" data-od-id="ds-specification">Ler especificação 1.0.1</a><a class="text-button" href="docs/design-system-tokens.json" target="_blank" rel="noopener" data-od-id="ds-tokens">Consultar tokens</a><a class="text-button" href="docs/design-system-changelog.md" target="_blank" rel="noopener" data-od-id="ds-changelog">Histórico de versões</a></div></div>
  <section class="panel" data-od-id="ds-authority"><h2>Como usar no refactor</h2><p class="muted">Cite a versão e a regra: por exemplo, CMP-006 para microfone e CMP-010 para o frame. Combine a regra visual com o contrato funcional e o mock da tela. Não copie os dados simulados para produção.</p><p class="small muted" style="margin-top:12px">Conformidade parcial dos mocks · integração nativa pendente · fonte oficial em design/ no repositório Matraca.</p><div class="actions" style="margin-top:12px"><a class="text-button" href="docs/design-system.md#gap-001--lacunas-declaradas" target="_blank" rel="noopener" data-od-id="ds-gaps">Ver lacunas de adoção</a><a class="text-button" href="docs/design-system-manifest.json" target="_blank" rel="noopener" data-od-id="ds-manifest">Manifesto de integridade</a></div></section>
 <div class="ds-grid"><section class="panel" data-od-id="system-tokens"><h2>1. Fundamentos</h2><p class="small muted">Um token é um nome para uma decisão. O componente pede “ação principal”, não uma cor específica.</p>${tokens.map(([name,label])=>`<div class="token-row"><i style="--token:var(${name})" aria-hidden="true"></i><code>${name}</code><span>${label}</span></div>`).join('')}</section>
 <section class="panel" data-od-id="system-type"><h2>2. Tipografia e espaço</h2><p class="small muted">Hierarquia primeiro, decoração depois. Uma família utilitária, adaptada ao sistema operacional.</p><div style="margin:24px 0"><h1 style="font-size:30px">Uma ideia por vez.</h1><h2>Título de uma seção</h2><p>Texto de leitura: explique o necessário, sem transformar a tela em um manual.</p><p class="small muted" style="margin-top:12px">Texto de apoio não é texto sem importância.</p></div><div class="token-row"><code>4 · 8 · 12 · 16 · 24 · 32</code><span>Escala de espaçamento, em pixels.</span></div><div class="token-row"><code>10 / 14 px</code><span>Cantos de controles / painéis.</span></div><div class="token-row"><code>46 px</code><span>Altura do botão de ação.</span></div><p class="small muted" style="margin-top:16px">A migração para tokens começou nos botões, no foco e nos novos painéis. O restante do CSS ainda será consolidado.</p></section></div>
 <section class="panel" data-od-id="system-actions"><h2>3. Componentes reutilizáveis</h2><p class="muted">Mesma peça, intenções diferentes. Os exemplos abaixo respondem ao clique sem alterar seu ditado.</p><div class="ds-example">${button('ds-primary','Ação principal','primary')}${button('ds-secondary','Ação secundária')}${textButton('ds-text','Ação discreta')}${button('ds-disabled','Indisponível','secondary','disabled')}</div><p class="small muted"><code>button()</code> + <code>.btn</code>: o mesmo botão utilizado no ditado e no teste de microfone. Uma ação principal por contexto.</p></section>
 <div class="ds-grid"><section class="panel" data-od-id="system-states"><h2>4. Estado tem significado</h2><div class="ds-example">${statusBadge('neutral','Pronto','ds-ready')}${statusBadge('active','Ouvindo','ds-active')}${statusBadge('success','Concluído','ds-success')}${statusBadge('error','Precisa de atenção','ds-error')}</div><p class="small muted">Texto e símbolo acompanham a cor. Verde de sucesso e vermelho de erro não mudam com a família escolhida.</p>${feedback('error','Não foi possível inserir.','A frase continua disponível. Tente novamente ou copie o texto.','ds-error-message',textButton('ds-retry','Tentar novamente'))}</section>
 <section class="panel" data-od-id="system-patterns"><h2>5. Regras de experiência</h2><ul class="guide-list"><li><strong>Espera precisa de explicação.</strong><p>“Transcrevendo” informa a etapa. Porcentagens só entram quando há progresso medido.</p></li><li><strong>Erro precisa de saída.</strong><p>Explique o que aconteceu, preserve o trabalho e ofereça uma recuperação próxima.</p></li><li><strong>Preferência não interrompe.</strong><p>Mudar a cor não reinicia o teste, o ditado nem a navegação.</p></li><li><strong>O sistema operacional continua familiar.</strong><p>Compartilhar componentes não significa imitar botões de janela ou permissões de outra plataforma.</p></li></ul></section></div>
 <section class="panel" data-od-id="system-next"><h2>Como essa biblioteca cresce</h2><p class="muted">Desenhamos uma tela, identificamos uma repetição e extraímos uma peça. Quando a peça muda, revisamos todas as telas que a usam. Não criamos componentes só para aumentar o catálogo.</p><div class="actions" style="margin-top:20px"><a class="btn secondary" href="matraca-experiencia.html#home" target="_blank" rel="noopener" data-od-id="open-dictation">Abrir tela de ditado ${icon('arrow')}</a><a class="text-button" href="matraca-experiencia.html#microphone" target="_blank" rel="noopener" data-od-id="open-microphone">Abrir tela de microfone</a></div><p class="small muted" style="margin-top:16px">Base de design, não biblioteca nativa pronta. Integração com Windows e macOS ainda não realizada.</p></section>`;
}
function hudCard(kind,title,detail,controls='',native=false){return `<div class="hud state-${kind} ${native?'native-hud':''} ${kind==='error'?'error':''} ${kind==='listening'?'listening':''}">${kind==='listening'?wave('hud-wave'):kind==='thinking'?'<span class="spinner" aria-hidden="true"></span>':icon(kind==='error'?'warning':kind==='writing'?'arrow':'check')}<div class="hud-copy"><strong>${escapeHTML(title)}</strong><p>${escapeHTML(detail)}</p></div>${controls}</div>`;}
function frameContent(){const continuous=frameDemo.scenario==='continuous';const copy={ready:['Pronto para ditar','O indicador fica oculto.'],listening:[continuous?'Ouvindo · sessão contínua':'Ouvindo você',continuous?`${frameDemo.segments} trechos entregues. A sessão continua ativa.`:'Pressione seu atalho para encerrar.'],thinking:[continuous?'Ouvindo · transcrevendo trecho':'Transcrevendo sua voz','Aguarde, sem sair da sua janela.'],writing:[continuous?'Ouvindo · inserindo trecho':'Inserindo o texto',frameDemo.lastText||'Destino: Notas de exemplo'],done:[continuous?'Trecho entregue · ainda ouvindo':'Texto entregue',frameDemo.lastText||'Tudo certo. Pode seguir.'],error:['Não foi possível inserir',frameDemo.lastText||'Recupere o texto no histórico.']};const [title,detail]=copy[frameDemo.state];return hudCard(frameDemo.state,title,detail,'',true);}
function frameControls(){return `<div class="frame-toolbar">${button('frame-play',frameDemo.running?'Recomeçar demonstração':'Reproduzir sequência','primary')}${textButton('frame-stop','Parar e ocultar')}<label>Cenário<select data-control="frame-scenario" data-od-id="frame-scenario">${[['success','Entrega concluída'],['error','Falha ao inserir'],['continuous','Ditado contínuo · por trechos']].map(([id,label])=>`<option value="${id}"${frameDemo.scenario===id?' selected':''}>${label}</option>`).join('')}</select></label></div><label class="frame-prompt">Texto completo da demonstração<textarea data-control="frame-prompt" data-od-id="frame-prompt"${frameDemo.running?' disabled':''}>${escapeHTML(frameDemo.prompt)}</textarea><span>O frame mostra no máximo duas linhas. Inserção e histórico preservam o conteúdo completo.</span></label>${textButton('frame-long','Experimentar um prompt longo',frameDemo.running?'disabled':'')}<div class="frame-events" aria-label="Inspecionar um estado do indicador">${FRAME_STATES.map(([id,label])=>`<button type="button" data-action="frame-event-${id}" data-od-id="frame-event-${id}" aria-pressed="${frameDemo.state===id}">${label}</button>`).join('')}</div><div class="actions">${textButton('frame-pin',frameDemo.pinned?'Destino fixado: sim':'Destino fixado: não','aria-pressed="'+frameDemo.pinned+'"')}${textButton('frame-reduced',frameDemo.reduced?'Movimento reduzido: sim':'Testar movimento reduzido','aria-pressed="'+frameDemo.reduced+'"')}</div>`;}
function recording(){return `<div class="frame-intro"><div><span class="eyebrow">Matraca · Frame e movimento</span><h1 style="margin-top:12px">Presente, sem interromper.</h1><p>O frame informa o que acontece. A moldura mostra onde o texto vai aparecer. São dois componentes, com o mesmo ritmo visual.</p></div>${statusBadge('neutral','Prévia sem captura','frame-demo-badge')}</div><section class="frame-stage" data-od-id="recording-stage"><div class="demo-window" id="demo-window" data-active="${frameDemo.state!=='ready'||frameDemo.pinned}" data-pinned="${frameDemo.pinned}"><header>${icon('document')}Notas de exemplo<span>Janela de destino · simulação</span></header><textarea aria-label="Texto da janela de exemplo" data-control="frame-draft" data-od-id="frame-draft">${escapeHTML(frameDemo.draft)}</textarea></div><div class="demo-hud-slot" id="demo-hud-slot" data-od-id="recording-frame">${frameDemo.state==='ready'?'':frameContent()}</div></section><div id="frame-controls">${frameControls()}</div><p class="small muted" id="frame-state-description">Estado: ${FRAME_STATES.find(([id])=>id===frameDemo.state)[1]}. O frame nativo não recebe cliques nem rouba o foco; os controles abaixo são apenas para esta demonstração.</p><div class="motion-grid"><section class="panel"><h2>Entrar e responder</h2><strong>120–180 ms</strong><p>Feedback imediato nos controles. O frame entra com deslocamento de 6 px e opacidade, sem salto de tamanho.</p></section><section class="panel"><h2>Mudar de estado</h2><strong>160 ms</strong><p>Troca curta de ícone e mensagem. Escuta usa barras decorativas; processamento usa rotação. Não representam nível real de áudio.</p></section><section class="panel"><h2>Concluir e sair</h2><strong>1.600 ms + saída de 140 ms</strong><p>Sucesso confirma e desaparece. No contínuo, volta a ouvir após 900 ms. Erro permanece até uma ação, sem tremer ou piscar.</p></section></div><p class="small muted">A preferência de movimento reduzido do sistema sempre é respeitada. O test function updateFrame(){

function playFrame(){

 const token=++frameGeneration;frameDemo.running=true;frameDemo.state='listening';frameDemo.lastText='';frameDemo.confirmedText='';frameDemo.segments=0;frameDemo.historyId=null;updateFrame();
 const continuous=frameDemo.scenario==='continuous',error=frameDemo.scenario==='error';
 const chars=Array.from(text),size=continuous?Math.ceil(chars.length/3):chars.length,chunks=[];
 for(let i=0;i<chars.length;i+=size)chunks.push(chars.slice(i,i+size).join(''));
 const sequence=[];

function render(focus=false) { const previous=document.activeElement; const focusedId=previous?.dataset?.odId;const selection=typeof previous?.selectionStart==='number'?[previous.selectionStart,previous.selectionEnd]:null; const menuOpen=document.querySelector?.('.appearance-menu')?.open;const entering=lastRenderedView!==state.view;lastRenderedView=state.view; applyTheme(); $('app').innerHTML=shell()+(state.view==='setup'?setup():['system','recording'].includes(state.view)?`<main class="ds-main" id="content" tabindex="-1">${state.view==='system'?systemGuide():recording()}</main>`:`<div class="app-layout">${sidebar()}<main class="main" id="content" tabindex="-1" data-od-id="main-content">${({home,microphone,history,settings,about}[state.view]||home)()}</main></div>`);const menu=document.querySelector?.('.appearance-menu');if(menu)menu.open=!!menuOpen&&!focus;if(entering)$('content')?.classList?.add('screen-enter'); renderHud(); if(focus)$('content').focus({preventScroll:true});else if(focusedId){const replacement=[...document.querySelectorAll('[data-od-id]')].find(el=>el.dataset.odId===focusedId);(replacement||$('content')).focus({preventScroll:true});if(replacement&&selection)replacement.setSelectionRange?.(...selection);} }

 const map={listening:['Ouvindo você','Demonstração · encerre quando quiser.'],transcribing:['Transformando em texto','Reconhecimento local · simulação'],writing:['Inserindo sua frase',state.view==='setup'?'No teste guiado':'No bloco de teste'],done:['Texto inserido','Tudo certo. Pode seguir.'],error:['Não foi possível inserir','Seu texto está salvo nesta sessão.']};const [title,desc]=map[status];

function changeStatus(status) { state.status=status; render(); }
function prepare() { generation++; const token=generation; state.step=1;state.preparing=true;state.prepared=false;state.progress=0;render(true); function tick(){ if(token!==generation)return;state.progress=Math.min(100,state.progress+20);const p=$('download-progress');if(p)p.value=state.progress;const label=$('download-percent');if(label)label.textContent=state.progress+'%';if(state.progress===100){state.prepared=true;state.preparing=false;render();announce('Modelo preparado na demonstração. Você pode continuar.');}else setTimeout(tick,450); }setTimeout(tick,450); }
function begin(test) { if(state.pending){toast('Insira a frase pendente antes de começar outro ditado.');return;}if(!['ready','done','error'].includes(state.status))return; generation++;state.testText=test?'':state.testText;state.tested=test?false:state.tested;changeStatus('listening'); }
function remember(text,usage=undefined) { const reviewUsage=usage===undefined?(config.postProcess?illustrativeUsage(config.postProcessProvider,config.postProcessModel):null):usage;if(reviewUsage)consumption.entries.push({...reviewUsage});if(state.keepHistory){state.history.unshift({id:'dictation-'+(++historySequence),text,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),reviewUsage});state.history=state.history.slice(0,config.historyMaxItems);} }
function deliver(token) { if(token!==generation)return; if(state.view==='setup'){state.testText=SAMPLE;state.tested=true;}else if(!state.target){state.pending=SAMPLE;remember(SAMPLE);changeStatus('error');return;}else{state.draft+=(state.draft?'\n':'')+SAMPLE;remember(SAMPLE);}changeStatus('done');setTimeout(()=>{if(token===generation&&state.status==='done')changeStatus('ready');},2200); }
function stop() { if(state.status!=='listening')return; const token=++generation;changeStatus('transcribing');setTimeout(()=>{if(token!==generation)return;changeStatus('writing');setTimeout(()=>deliver(token),700);},1000); }
async function copy(text) { if(!text)return;try { await navigator.clipboard.writeText(text);toast('Texto copiado.'); }catch(_){openModal('copy-fallback',text);} }
function openModal(kind,value='') { lastFocus=document.activeElement;state.modal=kind;let body='';if(kind==='preview-info')body=`<h2>Uma prévia para experimentar.</h2><p>Você pode navegar, preparar o primeiro uso e testar um ditado de exemplo.</p><p>Downloads, permissões e reconhecimento são simulados. Nenhum áudio é capturado e nenhum aplicativo externo é alterado.</p><p>Para experimentar a recuperação, pause o destino no bloco de teste antes de ditar.</p>`;if(kind==='review-info')body=`<h2>Uma revisão, se você quiser.</h2><p>O reconhecimento transforma a voz em texto no computador. A revisão é uma etapa separada e opcional, para corrigir pontuação ou ajustar o estilo.</p><p>Ao usar um provedor externo, o texto é enviado a esse serviço. Essa escolha deve ser explícita. A integração não está ativa nesta prévia.</p>`;if(kind==='clear-history')body=`<h2>Apagar o histórico?</h2><p>Os ditados desta sessão serão removidos. O texto que já está no bloco de teste será mantido.</p><div class="actions">${button('confirm-clear','Apagar histórico','secondary')}${textButton('close-modal','Cancelar')}</div>`;if(kind==='copy-fallback')body=`<h2>Copie a sua frase.</h2><p>O navegador não permitiu acessar a área de transferência. Selecione o texto abaixo e use o comando de copiar do sistema.</p><textarea id="copy-fallback" aria-label="Texto para copiar" style="width:100%;min-height:120px;background:var(--surface);padding:12px;border:1px solid var(--control-border);border-radius:8px">${escapeHTML(value)}</textarea>`;$('modal-root').innerHTML=`<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-label="${kind==='clear-history'?'Apagar histórico':'Informações do Matraca'}" data-od-id="information-dialog"><header><span class="grow"></span><button class="icon-button" data-action="close-modal" data-od-id="close-modal" aria-label="Fechar">${icon('close')}</button></header>${body}</section></div>`;$('modal-root').querySelector('button').focus(); }
function closeModal() { state.modal=null;$('modal-root').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus(); }
function navigate(view) { if(['listening','transcribing','writing'].includes(state.status)){toast('Encerre o ditado antes de mudar de tela.');return;}if(state.view==='recording'){frameGeneration++;frameDemo.running=false;clearTimeout(frameExitTimer);}clearTimeout(micTimer);if(mic.status==='testing'){mic.status='idle';mic.level=0;}generation++;state.status=state.pending?'error':'ready';state.view=view;render(true); }
function dispatch(action) {
 if(action==='frame-long'){if(frameDemo.running)return;frameDemo.prompt=Array.from({length:18},(_,i)=>`Parte ${i+1}: documentar as decisões, preservar os detalhes e organizar os próximos passos sem resumir o pedido original.`).join('\n\n');frameDemo.lastText=frameDemo.prompt;frameDemo.state='done';return updateFrame();}
 if(action==='frame-play')return playFrame();
 if(action==='frame-stop'){frameGeneration++;frameDemo.running=false;frameDemo.state='ready';return updateFrame();}
 if(action==='frame-pin'){frameDemo.pinned=!frameDemo.pinned;return updateFrame();}
 if(action==='frame-reduced'){frameDemo.reduced=!frameDemo.reduced;document.documentElement.dataset.motion=frameDemo.reduced?'reduce':'system';return updateFrame();}
 if(action.startsWith('frame-event-')){const next=action.slice(12);if(!FRAME_STATES.some(([id])=>id===next))return;frameGeneration++;frameDemo.running=false;frameDemo.state=next;return updateFrame();}
 if(action.startsWith('select-history-')){const id=action.slice(15);if(!state.history.some(x=>x.id===id))return;consumption.selectedId=id;return render();}
 if(action==='reset-history-filters'){state.query='';consumption.provider='all';return render();}
 if(action.startsWith('section-')){const section=action.slice(8);if(!CONFIG_SECTIONS.some(([id])=>id===section))return;clearTimeout(micTimer);if(mic.status==='testing'){mic.status='idle';mic.level=0;}configUI.section=section;return render(true);}
 if(action.startsWith('config-toggle-')){const key=action.slice(14);if(CONFIG_FIELDS.some(([id,,type])=>id===key&&type==='boolean'))return changeConfig(key,!config[key]);return;}
 if(action==='credential-example'){const key=credentialKey();configUI.credentials[key]=!configUI.credentials[key];config.postProcess=false;configUI.reviewResult=false;delete configUI.errors.postProcess;render();return announce('Credencial fictícia alterada. Nenhum segredo foi armazenado.');}
 if(action==='review-example'){if(!config.postProcess)return;configUI.reviewResult=true;remember('Vamos combinar a reunião amanhã às nove.');render();return announce('Exemplo de revisão registrado com consumo simulado quando disponível. Nenhuma chamada de rede foi realizada.');}
 if(action.startsWith('download-'))return downloadModel(action.slice(9));
 if(action==='cancel-model-download'){clearTimeout(configTimer);configUI.modelDownload=null;configUI.modelProgress=0;render();return announce('Download simulado cancelado.');}
 if(action.startsWith('config-file-')){if(isMac())return;const key=action.slice(12);if(!['modelPath','startSound','stopSound'].includes(key))return;return changeConfig(key,key==='modelPath'?'models/ggml-small.bin':'sounds/'+(key==='startSound'?'inicio':'fim')+'.wav');}
 if(action.startsWith('config-sound-')){if(isMac()||!config.beep)return;return toast('Prévia de som simulada. Nenhum áudio foi reproduzido.');}
 if(action.startsWith('ds-'))return toast('Exemplo do componente. Nenhum ditado foi alterado.');
 if(action==='mic-start')return startMic();
 if(action==='mic-stop'){clearTimeout(micTimer);mic.status='idle';mic.level=0;render();return announce('Teste interrompido.');}
 if(action==='mic-reset'){config.micSensitivity[deviceName()]=0.012;mic.detected=false;render();return announce('Ajuste inicial restaurado apenas para este microfone.');}
 if(action==='cancel-dictation'&&state.status==='listening'){generation++;changeStatus('ready');return announce('Ditado cancelado.');}
 if(action.startsWith('color-')){const palette=action.slice(6);if(!PALETTES.some(([id])=>id===palette))return;state.palette=palette;savePreferences();render();return announce('Cor de destaque atualizada.');}
 if(action.startsWith('nav-'))return navigate(action.slice(4));
 if(action==='prepare')return prepare();
 if(action==='cancel-preparation'||action==='setup-back'){generation++;state.preparing=false;state.prepared=false;state.progress=0;state.step=0;return render(true);}
 if(action==='permissions-step'&&state.prepared){state.step=2;return render(true);}
 if(action==='back-model'){state.step=1;return render(true);}
 if(action==='allow-microphone'){state.microphone=true;render();return announce('Permissão de microfone simulada.');}
 if(action==='allow-writing'){state.accessibility=true;render();return announce('Inserção conferida na demonstração.');}
 if(action==='test-step'&&state.microphone&&state.accessibility){state.step=3;return render(true);}
 if(action==='back-permissions'&&state.status==='ready'){state.step=2;return render(true);}
 if(action==='start-test'||action==='repeat-test')return begin(true);
 if(action==='start-home')return begin(false);
 if(action==='stop')return stop();
 if(action==='finish-setup'&&state.tested){state.complete=true;return navigate('home');}
 if(action==='theme'){state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';savePreferences();return render();}
 if(action==='preview-info'||action==='review-info'||action==='clear-history')return openModal(action);
 if(action==='close-modal')return closeModal();
 if(action==='confirm-clear'){state.history=[];closeModal();return render(true);}
 if(action==='toggle-history'){state.keepHistory=!state.keepHistory;return render();}
 if(action==='toggle-sound'){state.sound=!state.sound;return render();}
 if(action==='restart-setup'){generation++;state.view='setup';state.step=0;state.tested=false;state.testText='';state.status='ready';state.microphone=false;state.accessibility=false;return render(true);}
 if(action==='target-toggle'){state.target=!state.target;render();return announce(state.target?'Destino de teste reativado.':'Destino de teste pausado.');}
 if(action==='retry'&&state.pending){state.target=true;state.draft+=(state.draft?'\n':'')+state.pending;state.pending='';changeStatus('done');const token=++generation;return setTimeout(()=>{if(token===generation)changeStatus('ready');},2200);}
 if(action==='copy-pending')return copy(state.pending);
 if(action==='reset-search'){state.query='';return render();}
 for(const prefix of ['copy-entry-','delete-entry-','insert-entry-'])if(action.startsWith(prefix)){const id=action.slice(prefix.length),entry=state.history.find(x=>x.id===id);if(!entry)return;if(prefix==='copy-entry-')return copy(entry.text);if(prefix==='delete-entry-'){state.history=state.history.filter(x=>x.id!==id);render();return announce('Ditado apagado.');}state.draft+=(state.draft?'\n':'')+entry.text;state.target=true;return navigate('home');}
}
document.addEventListener('click',event=>{const menu=document.querySelector?.('.appearance-menu');if(menu?.open&&!event.target.closest('.appearance-menu'))menu.open=false;const target=event.target.closest('[data-action]');if(target&&!target.disabled)dispatch(target.dataset.action);});
document.addEventListener('input',event=>{const name=event.target.dataset.control;if(name==='sensitivity'){const value=Number(event.target.value);if(!Number.isFinite(value))return;config.micSensitivity[deviceName()]=Math.max(.001,Math.min(.5,value));const position=levelPosition(deviceThreshold());$('voice-adjustment')?.style?.setProperty('--voice-start',position+'%');event.target.setAttribute?.('aria-valuetext',position<10?'Mais sensível':position>60?'Ignora mais ruído':'Sensibilidade intermediária');$('mic-readout').innerHTML=micReadout();}if(name==='draft')state.draft=event.target.value;if(name==='query'){state.query=event.target.value;const temp=document.createElement('div');temp.innerHTML=history();$('history-results').innerHTML=temp.querySelector('#history-results').innerHTML;}});
document.addEventListener('change',event=>{if(event.target.dataset.configKey){if(event.target.disabled)return;return changeConfig(event.target.dataset.configKey,event.target.value);}const name=event.target.dataset.control;if(name==='usage-provider'){const provider=event.target.value;if(provider!=='all'&&!consumption.entries.some(x=>x.provider===provider))return;consumption.provider=provider;return render();}if(name==='mic-device')return selectMic(event.target.value);if(name==='hotkey'){state.hotkey=event.target.value;savePreferences();announce('Atalho atualizado nesta prévia.');}if(name==='theme'){if(!['system','light','dark'].includes(event.target.value))return;state.theme=event.target.value;savePreferences();render();announce('Modo de exibição atualizado.');}});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){const menu=document.querySelector?.('.appearance-menu');if(menu?.open){event.preventDefault();menu.open=false;menu.querySelector('summary').focus();return;}}
 if(state.modal){if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const nodes=[...$('modal-root').querySelectorAll('button,textarea')];const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}return;}
 if(event.key==='Escape'&&state.status==='listening'){event.preventDefault();generation++;changeStatus('ready');announce('Ditado cancelado.');return;}
 if(event.repeat||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;
 const matches=state.hotkey==='F8'?event.key==='F8':state.hotkey==='Alt + Espaço'?event.altKey&&event.code==='Space':event.ctrlKey&&event.shiftKey&&event.code==='Space';
 if(matches&&(state.view==='home'||(state.view==='setup'&&state.step===3))){event.preventDefault();state.status==='listening'?stop():begin(state.view==='setup');}
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')render();});
document.addEventListener('input',event=>{if(event.target.dataset.control==='frame-draft')frameDemo.draft=event.target.value;if(event.target.dataset.control==='frame-prompt'&&!frameDemo.running)frameDemo.prompt=event.target.value;});
document.addEventListener('change',event=>{if(event.target.dataset.control==='frame-scenario'&&['success','error','continuous'].includes(event.target.value)){frameGeneration++;frameDemo.running=false;frameDemo.scenario=event.target.value;updateFrame();}});
document.addEventListener('keydown',event=>{if(!event.defaultPrevented&&event.key==='Escape'&&state.view==='recording'){event.preventDefault();dispatch('frame-stop');}});
const entry=(window.location?.hash||'').slice(1);
if(['home','microphone','history','settings','system','recording'].includes(entry))state.view=entry;
if(entry==='history-demo'){
 state.view='history';
 remember('Um lembrete simples, sem dados de revisão disponíveis.',null);
 remember('A proposta está pronta. Podemos conversar amanhã?',illustrativeUsage('openai-compatible','modelo de exemplo','2026-09-06T15:00:00Z'));
 remember('Organize os pontos da reunião em uma lista.',illustrativeUsage('deepseek','deepseek-v4-pro','2026-09-06T15:01:00Z'));
 remember('Vamos combinar a reunião amanhã às nove.',illustrativeUsage('deepseek','deepseek-v4-flash','2026-09-06T15:02:00Z'));
 state.history.forEach((item,index)=>item.time=['12:02','12:01','12:00','11:59'][index]);
}
render();
</script>

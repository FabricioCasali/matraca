# CI/CD do Matraca:
#  - push/PR: compila e gera o instalador como artefato do run (validacao)
#  - tag v* (ex.: v1.0.0): gera o instalador, manda assinar no SignPath e publica o Release
# Como lancar uma versao:  git tag v1.2.3 && git push origin v1.2.3
#
# Assinatura: enquanto o projeto nao for aprovado no SignPath Foundation, basta nao definir os
# secrets/vars abaixo — o passo de assinatura e' pulado e o release sai sem assinar, como antes.
#   secrets.SIGNPATH_API_TOKEN     token da API do SignPath
#   vars.SIGNPATH_ORGANIZATION_ID  id da organizacao no SignPath
#   vars.SIGNPATH_PROJECT_SLUG     slug do projeto      (padrao: matraca)
#   vars.SIGNPATH_POLICY_SLUG      slug da signing policy (padrao: release-signing)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # criar o release
  id-token: write # exigido pelo SignPath p/ atestar a origem do build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versao (tag v1.2.3 -> 1.2.3; senao 0.0.0)
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar design e interface compartilhada
        shell: pwsh
        run: |
          npm ci --prefix tools/icons --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node design/tests/matraca-design-system.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node design/tests/matraca-prototype.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node design/tests/matraca-brand.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node Matraca.Web/export-design.cjs --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/web/ui.test.cjs tests/hud-ds101-exclusive.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/windows-icons.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/macos-icons.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Testar Core e compilar solution
        shell: pwsh
        run: |
          dotnet test Matraca.sln -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build Matraca.sln -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Gerar instalador
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Artefato de CI (pushes sem tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: matraca-setup-ci
          path: installer/output/*.exe

      # ---- assinatura (so' em tag, e so' se o SignPath estiver configurado) ----
      - name: Ha' credenciais do SignPath?
        id: signpath
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $ready = [string]::IsNullOrWhiteSpace($env:TOKEN) -eq $false -and
                   [string]::IsNullOrWhiteSpace($env:ORG) -eq $false
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $ready) {
            Write-Host '::warning::SignPath nao configurado; o release sai SEM assinatura.'
          }

      - name: Subir instalador nao assinado
        id: unsigned
        if: ${{ steps.signpath.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: matraca-setup-unsigned
          path: installer/output/*.exe

      - name: Assinar no SignPath (requer aprovacao manual)
        if: ${{ steps.signpath.outputs.ready == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'matraca' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/output

      - name: Publicar release (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
          body: |
            ## Code signing policy

            Signing status: ${{ steps.signpath.outputs.ready == 'true' && 'Signed through SignPath after approval.' || 'Unsigned installer: SignPath is not configured. Windows may show a security warning.' }}

            Built by GitHub Actions from the tagged commit. When configured, free code signing is
            provided by [SignPath.io](https://signpath.io), with a certificate from
            [SignPath Foundation](https://signpath.org), and requires manual approval.
            Team roles, build process and privacy policy:
            [CODE_SIGNING_POLICY.md](https://github.com/FabricioCasali/matraca/blob/main/CODE_SIGNING_POLICY.md).
